name: LEAN Signal Scaffold Syntax Check

on:
  push:
    branches: [lean-engine-evaluation]
    paths:
      - "lean-research/**"
      - ".github/workflows/lean-syntax-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile LEAN algorithm source
        run: python -m py_compile lean-research/main.py
      - name: Verify strategy parity and signal-only safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("lean-research/main.py").read_text()
          forbidden = ("MarketOrder(", "SetHoldings(", "LimitOrder(", "StopMarketOrder(")
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f"Unexpected order submission methods: {found}")
          required = (
              'self.AddForex("EURUSD"',
              "AverageTrueRange(14, MovingAverageType.Wilders)",
              "ExponentialMovingAverage(20)",
              "ExponentialMovingAverage(50)",
              "AverageDirectionalIndex(14)",
              "len(self.prior_highs) == 20",
              "len(self.prior_atrs) == 50",
              "atr_baseline * 1.10",
              "bar.EndTime.hour in (7, 15)",
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"Missing strategy parity elements: {missing}")
          print("LEAN strategy parity syntax and no-order safety checks passed.")
          PY
