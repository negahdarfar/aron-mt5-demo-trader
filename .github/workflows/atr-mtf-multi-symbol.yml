name: ATR MTF Multi-Symbol Validation

on:
  push:
    branches: [atr-breakout-mtf-validation]
    paths:
      - ".github/workflows/atr-mtf-multi-symbol.yml"
      - "src/aron_trader/**"
      - "scripts/compare_atr_mtf_variants.py"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [gbpusd, usdjpy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Download historical M15 candles
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          npx --yes dukascopy-node@latest -i "$SYMBOL" -from "2025-08-01" -to "2026-11-01" -t "m15" -f csv -v --retries 3 --cache
          test -d download
          CSV="$(find download -maxdepth 1 -type f -name '*.csv' | head -n 1)"
          test -n "$CSV"
          echo "CSV=$CSV" >> "$GITHUB_ENV"
      - name: Run fixed three-variant monthly walk-forward comparison
        env:
          SYMBOL: ${{ matrix.symbol }}
          CSV: ${{ env.CSV }}
        run: |
          set -euo pipefail
          python scripts/compare_atr_mtf_variants.py --csv "$CSV" --symbol "$SYMBOL" | tee "atr-mtf-comparison-$SYMBOL.json"
      - name: Upload symbol report and source candles
        uses: actions/upload-artifact@v4
        with:
          name: atr-mtf-validation-${{ matrix.symbol }}
          path: |
            atr-mtf-comparison-${{ matrix.symbol }}.json
            download/*.csv
          if-no-files-found: error
          retention-days: 30
