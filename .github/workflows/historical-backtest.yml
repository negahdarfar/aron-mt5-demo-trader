name: ARON Historical Backtest
# Research matrix: October 2026 evaluation; September is warm-up. Includes corrected regime-switching Wizards ensemble with HTF warm-up guard.

on:
  push:
    paths:
      - ".github/workflows/historical-backtest.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Market instrument"
        required: true
        type: choice
        options:
          - eurusd
          - gbpusd
          - usdjpy
          - xauusd
      timeframe:
        description: "Candle timeframe"
        required: true
        type: choice
        options:
          - m15
          - h1
          - h4
          - d1
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-09-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-11-01"
      strategy:
        description: "Research strategy"
        required: true
        type: choice
        options:
          - ema_rsi
          - smc
          - pro
          - mtf
          - wizards
          - donchian
          - ema_trend
          - momentum
          - atr_breakout
          - trend_pullback
          - bos_retest

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Download historical candles
        env:
          SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol || 'eurusd' }}
          TIMEFRAME: ${{ github.event_name == 'workflow_dispatch' && inputs.timeframe || 'm15' }}
          START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || '2026-09-01' }}
          END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || '2026-11-01' }}
          STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'ema_rsi' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import date
          start = date.fromisoformat(os.environ["START_DATE"])
          end = date.fromisoformat(os.environ["END_DATE"])
          if end <= start:
              raise SystemExit("End date must be after start date")
          if (end - start).days > 730:
              raise SystemExit("Limit each run to 730 days; use smaller date ranges")
          PY
          npx --yes dukascopy-node@latest -i "$SYMBOL" -from "$START_DATE" -to "$END_DATE" -t "$TIMEFRAME" -f csv -v --retries 3 --cache
          test -d download
          find download -maxdepth 1 -type f -name '*.csv' -print
      - name: Run selected strategy backtest
        env:
          SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol || 'eurusd' }}
          STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'trend_pullback' }}
        run: |
          set -euo pipefail
          CSV="$(find download -maxdepth 1 -type f -name '*.csv' | head -n 1)"
          test -n "$CSV"
          WINDOW="--trade-start 2026-10-01 --trade-end 2026-11-01"
          python -m aron_trader.cli --csv "$CSV" --symbol "$SYMBOL" --strategy "$STRATEGY" $WINDOW | tee "backtest-$STRATEGY-zero-cost.json"
          python -m aron_trader.cli --csv "$CSV" --symbol "$SYMBOL" --strategy "$STRATEGY" --spread 0.0001 --slippage 0.00005 $WINDOW | tee "backtest-$STRATEGY-cost-sensitivity.json"
      - name: Upload selected strategy results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('backtest-{0}-{1}-{2}', inputs.strategy || 'trend_pullback', inputs.symbol || 'eurusd', inputs.timeframe || 'm15') }}
          path: |
            download/*.csv
            backtest-*.json
          if-no-files-found: error
          retention-days: 14
